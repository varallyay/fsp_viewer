# Builds FSP Viewer as a Windows application that runs without Python (build_windows.py):
# a folder with "FSP Viewer.exe", packed as FSP-Viewer-<version>-windows.zip.
#
#  - On a version tag (v0.2.1, ...): the .zip is attached to the GitHub release of that tag
#    (the release is made if it does not exist yet). The tag must match APP_VERSION.
#  - Started by hand (Actions > Windows build > Run workflow): the .zip is kept as a
#    download of that run (Artifacts), nothing is published.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to attach the .zip to the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install the build packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"', open('fsp_gui.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION is $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match APP_VERSION $version in fsp_gui.py."
            exit 1
          fi

      - name: Build and self-test
        run: python build_windows.py

      - name: Keep the .zip as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: FSP-Viewer-${{ steps.version.outputs.version }}-windows
          path: dist/FSP-Viewer-${{ steps.version.outputs.version }}-windows.zip
          if-no-files-found: error

      - name: Attach the .zip to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/FSP-Viewer-${{ steps.version.outputs.version }}-windows.zip"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "FSP Viewer ${{ steps.version.outputs.version }}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
